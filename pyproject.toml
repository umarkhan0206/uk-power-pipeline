[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukpower"
version = "0.1.0"
description = "UK electricity market pipeline, price forecaster and battery trading backtest"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]